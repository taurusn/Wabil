<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wabil — bubble animation lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{ font-family:'Inter',system-ui,sans-serif; background:#05060a; color:#e6ecf6;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:18px; padding:28px 16px 48px; }
  h1{ font-size:15px; font-weight:500; color:#aeb8cc; letter-spacing:.02em; }
  .sub{ font-size:12.5px; color:#5d6a85; margin-top:-10px; }

  /* phone */
  .phone{ width:330px; height:660px; border-radius:44px; border:9px solid #15171d; overflow:hidden; position:relative;
    box-shadow:0 34px 70px -22px rgba(0,0,0,.7), 0 0 0 1px rgba(120,150,200,.08); }
  .screen{ position:absolute; inset:0; background:radial-gradient(135% 75% at 72% 6%, #1a2536 0%, #0b0d13 54%);
    display:flex; flex-direction:column; }
  .hd{ flex:0 0 auto; padding:16px 22px 8px; display:flex; align-items:center; gap:10px; }
  .orb{ width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#aee0ff,#4f8fe0 55%,#2a4d8f 100%);
    box-shadow:0 0 14px 3px rgba(96,165,250,.45); }
  .nm{ font-size:14px;font-weight:500;color:#aeb8cc; } .nm small{ color:#5d6a85;font-weight:300; }
  .chat{ flex:1; padding:16px 18px 16px; display:flex; flex-direction:column; justify-content:flex-end; gap:14px; overflow:hidden; }

  /* message rows */
  .row{ display:flex; }
  .row.me{ justify-content:flex-end; }
  .row.them{ justify-content:flex-start; }
  .me .bub{ background:rgba(120,150,200,.14); border:1px solid rgba(140,170,220,.18); color:#d4ddee;
    border-radius:16px 16px 5px 16px; padding:10px 15px; font-size:14px; max-width:78%; }
  .them .prose{ display:flex; gap:9px; max-width:86%; }
  .them .gl{ color:#6ba8ff; font-size:14px; line-height:21px; flex:0 0 auto; }
  .them .tx{ font-family:'Inter';font-weight:300;font-size:14px;line-height:21px;color:#8492ac; }
  .will-anim{ opacity:0; } /* hidden until JS animates in */

  /* typing pill */
  .typing{ align-self:flex-start; display:inline-flex; gap:5px; align-items:center; background:rgba(120,150,200,.06);
    border:1px solid rgba(140,170,220,.16); border-radius:16px; border-bottom-left-radius:5px; padding:11px 14px; }
  .typing .d{ width:6px;height:6px;border-radius:3px;background:#8492ac; animation:wave 1.3s ease-in-out infinite; }
  .typing .d:nth-child(2){ animation-delay:.16s; } .typing .d:nth-child(3){ animation-delay:.32s; }
  @keyframes wave{ 0%,60%,100%{ opacity:.35; transform:scale(.75);} 30%{ opacity:1; transform:scale(1.1);} }

  /* controls */
  .panel{ width:330px; display:flex; flex-direction:column; gap:12px; }
  .variants{ display:flex; gap:8px; }
  .variants button{ flex:1; padding:9px 6px; border-radius:11px; border:1px solid rgba(140,170,220,.18);
    background:rgba(120,150,200,.05); color:#aeb8cc; font:inherit; font-size:12px; cursor:pointer; }
  .variants button.on{ background:linear-gradient(180deg,#3f7fdc,#2c5fb0); color:#fff; border-color:transparent; }
  .actions{ display:flex; gap:8px; }
  .actions button{ flex:1; padding:12px; border-radius:13px; border:none; cursor:pointer; font:inherit; font-size:13px; font-weight:500;
    background:rgba(120,150,200,.08); color:#cdd6e8; border:1px solid rgba(140,170,220,.14); }
  .actions button.primary{ background:linear-gradient(180deg,#3f7fdc,#2c5fb0); color:#fff; border-color:transparent; }
  .hint{ font-size:11.5px;color:#5d6a85; text-align:center; line-height:1.5; }
  .vname{ color:#7fb0ff; }
</style>
</head>
<body>
  <h1>wabil · bubble animation lab</h1>
  <div class="sub">3 variants, all on the real iMessage spring (stiffness 200 · mass 0.2 · damping 20)</div>

  <div class="phone"><div class="screen">
    <div class="hd"><span class="orb"></span><span class="nm">wabil<small> · listening</small></span></div>
    <div class="chat" id="chat"></div>
  </div></div>

  <div class="panel">
    <div class="variants" id="variants">
      <button data-v="slide" class="on">slide + fade<br><small>(samuelkraft)</small></button>
      <button data-v="pop">scale-pop<br><small>(from corner)</small></button>
      <button data-v="combo">combined<br><small>(slide + inflate)</small></button>
    </div>
    <div class="actions">
      <button class="primary" id="play">▶ play scene</button>
      <button id="one">+ one bubble</button>
      <button id="burst">burst of 3</button>
    </div>
    <div class="hint">current: <span class="vname" id="vlabel">slide + fade</span> · watch the typing pill → bubble, and how older bubbles reflow up</div>
  </div>

<script>
const chat = document.getElementById('chat');
let variant = 'slide';

// --- real spring physics (same model as framer-motion): damped harmonic oscillator ---
function springFrames({stiffness=200, mass=0.2, damping=20, from=1, to=0, fps=60, max=2}) {
  const dt = 1/fps; let x = from - to, v = 0; const out = [];
  for (let t=0; t<=max; t+=dt) {
    const a = (-stiffness * x - damping * v) / mass;
    v += a*dt; x += v*dt; out.push(to + x);
    if (Math.abs(x) < 0.001 && Math.abs(v) < 0.01) break;
  }
  out.push(to); return out;
}
// progress 0->1 on the spring (settles with a touch of overshoot)
const PROG = springFrames({from:0, to:1});

function buildKeyframes(v) {
  // map the spring progress to transforms per variant
  return PROG.map((p, i) => {
    const op = Math.min(1, i < PROG.length*0.35 ? p*2.2 : 1); // fade in over first third
    if (v === 'slide')  return { opacity: op, transform: `translateY(${(1-p)*26}px)` };
    if (v === 'pop')    return { opacity: op, transform: `scale(${0.6 + 0.4*p})`, transformOrigin: 'bottom left' };
    /* combo */         return { opacity: op, transform: `translateY(${(1-p)*18}px) scale(${0.86 + 0.14*p})`, transformOrigin: 'bottom left' };
  });
}

function animateIn(el) {
  const kf = buildKeyframes(variant);
  el.style.opacity = '';
  el.classList.remove('will-anim');
  el.animate(kf, { duration: (PROG.length/60)*1000, easing: 'linear', fill: 'both' });
}

// FLIP: smoothly reflow the existing bubbles when a new one is added
function withReflow(addFn) {
  const rows = [...chat.children];
  const before = rows.map(r => r.getBoundingClientRect().top);
  addFn();
  const rows2 = [...chat.children].filter(r => rows.includes(r));
  rows2.forEach((r, i) => {
    const dy = before[i] - r.getBoundingClientRect().top;
    if (dy) r.animate(
      [{ transform:`translateY(${dy}px)` }, { transform:'translateY(0)' }],
      { duration: 480, easing: 'cubic-bezier(.22,1,.36,1)' }
    );
  });
}

function addMe(text){
  withReflow(()=>{
    const row=document.createElement('div'); row.className='row me';
    row.innerHTML=`<div class="bub will-anim">${text}</div>`;
    chat.appendChild(row); animateIn(row.firstElementChild);
  });
}
function addThem(text){
  withReflow(()=>{
    const row=document.createElement('div'); row.className='row them';
    row.innerHTML=`<div class="prose will-anim"><span class="gl">⌁</span><span class="tx">${text}</span></div>`;
    chat.appendChild(row); animateIn(row.firstElementChild);
  });
}
function typing(){
  const row=document.createElement('div'); row.className='row them';
  row.innerHTML=`<div class="typing"><span class="d"></span><span class="d"></span><span class="d"></span></div>`;
  chat.appendChild(row); return row;
}
const wait = ms => new Promise(r=>setTimeout(r,ms));

async function thenReply(text){
  const t = typing(); await wait(900);
  withReflow(()=>{ t.remove(); }); // remove typing, others hold
  addThem(text);
}

async function scene(){
  chat.innerHTML='';
  await wait(200);
  addMe('any unreads? roast me');
  await wait(700); await thenReply('one sec, peeking into the void you call an inbox...');
  await wait(1400);
  const t=typing(); await wait(1100); withReflow(()=>t.remove());
  addThem('at least 500 unread. gmail gave up counting.');
  await wait(650); addThem('your inbox is an archaeological dig site. swap me when you can.');
}

// wiring
document.getElementById('variants').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  variant=b.dataset.v;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on', x===b));
  document.getElementById('vlabel').textContent = b.textContent.split('(')[0].trim();
});
document.getElementById('play').onclick = scene;
document.getElementById('one').onclick = ()=> addThem('this is what a single bubble looks like.');
document.getElementById('burst').onclick = async ()=>{
  addThem('first text.'); await wait(550); addThem('second one right after.'); await wait(550); addThem('and a third.');
};
scene();
</script>
</body>
</html>
